<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Synapse League</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Synapse League: a teaching simulation of manipulative free-to-play design. A creature battler with booster packs, a hidden ad-value manipulation engine and a Researcher View that exposes it. Every ad is fictional; nothing leaves this browser.">
<meta name="theme-color" content="#0b0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Synapse">
<meta name="mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0f1a'/%3E%3Ccircle cx='32' cy='30' r='11' fill='none' stroke='%2322d3ee' stroke-width='4'/%3E%3Cpath d='M32 41v16M22 22l-9-7M42 22l9-7M20 34l-10 4M44 34l10 4' stroke='%2322d3ee' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230b0f1a'/%3E%3Ccircle cx='32' cy='30' r='11' fill='none' stroke='%2322d3ee' stroke-width='4'/%3E%3Cpath d='M32 41v16M22 22l-9-7M42 22l9-7M20 34l-10 4M44 34l10 4' stroke='%2322d3ee' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- The phone frame. Every screen is a <section data-screen>; overlays stack above; the lab drawer is a sibling. -->
<div id="app" data-screen="home">
  <section class="screen" data-screen="home" aria-label="Home"></section>
  <section class="screen" data-screen="ladder" aria-label="Ladder"></section>
  <section class="screen" data-screen="team" aria-label="Team"></section>
  <section class="screen" data-screen="battle" aria-label="Battle"></section>
  <section class="screen" data-screen="shop" aria-label="Shop"></section>
  <section class="screen" data-screen="pack" aria-label="Pack opening"></section>
  <section class="screen" data-screen="binder" aria-label="Binder"></section>
  <section class="screen" data-screen="settings" aria-label="Settings and About"></section>
  <div id="pill"></div>
  <div class="overlay" data-overlay="coach"></div>
  <div class="overlay" data-overlay="sheet"></div>
  <div class="overlay" data-overlay="modal"></div>
  <div class="overlay" data-overlay="ad"></div>
  <div class="overlay" data-overlay="toast" aria-live="polite"></div>
  <div class="overlay" data-overlay="about"></div>
  <button id="flask" type="button" aria-label="Researcher View (L)" title="Researcher View (L)">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 3h6M10 3v6.5L4.5 19a1.5 1.5 0 0 0 1.3 2.2h12.4a1.5 1.5 0 0 0 1.3-2.2L14 9.5V3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M7.5 15h9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  </button>
</div>
<aside id="lab" aria-label="Researcher View"></aside>
<script src="cards.js"></script>
<script src="game.js"></script>
</body>
</html>
